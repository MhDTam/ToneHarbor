name: Bug report
description: Report a reproducible ToneHarbor problem
body:
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, theme, language, screen size and display scaling.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected behavior
      description: Include what happens instead. Remove personal paths from logs and use synthetic media.
    validations:
      required: true
